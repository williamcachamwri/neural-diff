[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "neural-diff"
version = "0.1.0"
description = "Git for AI Brains — Structural, Neural & Behavioral Intelligence Comparison"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
authors = [
  { name = "William Cachamwri" }
]
keywords = [
  "machine-learning",
  "llm",
  "model-diff",
  "safetensors",
  "interpretability",
  "regression-testing",
  "pytorch",
  "transformers"
]
dependencies = [
  "torch>=2.7.0",
  "transformers>=4.48.0",
  "safetensors>=0.5.0",
  "huggingface-hub>=0.28.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "uvicorn>=0.34.0",
  "psutil>=6.1.0",
  "accelerate>=1.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pytest-asyncio>=0.25.0",
  "hypothesis>=6.124.0",
  "httpx>=0.28.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "playwright>=1.50.0",
  "pip-audit>=2.7.3",
]

[project.scripts]
neural-diff = "core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "benchmarks", "api"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["core", "adapters", "benchmarks", "api", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["E501", "S101", "S603", "S310"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S301"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["frontend/", "build/", "dist/", ".venv/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: fast mathematical and component unit tests",
  "integration: multi-module, API, and checkpoint pipeline tests",
  "property: Hypothesis property-based invariant tests",
  "regression: deterministic golden-fixture regression tests",
  "security: adversarial input, path traversal, and unsafe serialization tests",
  "real_model: tests requiring real downloaded Hugging Face models",
]

[tool.coverage.run]
source = ["core", "adapters", "benchmarks", "api"]
omit = ["tests/*", "scripts/*"]
