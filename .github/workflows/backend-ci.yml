name: Backend Lint, Typecheck & Matrix Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static-analysis:
    name: Ruff Lint & MyPy Typecheck (86 Files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync locked Python 3.12 environment
        run: uv sync --locked --python 3.12

      - name: Ruff lint check
        run: uv run ruff check core adapters benchmarks api tests scripts

      - name: MyPy static type check
        run: uv run mypy core adapters benchmarks api

  unit-property-matrix:
    name: Unit, Property & Regression (Python ${{ matrix.python-version }})
    needs: static-analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Provision Python ${{ matrix.python-version }}
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run Unit, Hypothesis Property & Golden Regression suites
        run: uv run pytest -m "unit or property or regression" -v

  windows-portability:
    name: Windows Safetensors Mmap & NTFS Confinement
    needs: static-analysis
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Provision Windows CPU Python 3.12 environment
        run: uv sync --no-sources --python 3.12

      - name: Verify Windows mmap clone safety, SQLite WAL & path confinement
        run: |
          uv run pytest tests/unit/test_loaders_and_adapters.py tests/unit/test_evolution_dag_and_store.py tests/security/test_evolution_security.py -v

  integration-and-coverage:
    name: Full Integration & Coverage Gate (>=85%)
    needs: [unit-property-matrix, windows-portability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Provision locked Python 3.12 environment
        run: uv sync --locked --python 3.12

      - name: Run complete backend suite with 85% coverage gate
        run: |
          uv run pytest -m "not real_model" \
            --cov=core --cov=adapters --cov=benchmarks --cov=api \
            --cov-report=term-missing \
            --cov-report=xml:coverage-3.12.xml \
            --cov-fail-under=85 -v

      - name: Upload XML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-py3.12
          path: coverage-3.12.xml
          retention-days: 14
