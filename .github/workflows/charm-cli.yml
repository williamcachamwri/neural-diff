name: Charmbracelet v2 Go CLI & Multi-OS TUI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: charm-cli-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  charm-cli-matrix:
    name: Charm v2 CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go (>= 1.26)
        uses: actions/setup-go@v6
        with:
          go-version: ">=1.26.0"
          cache-dependency-path: cli/go.sum

      - name: Verify Go vet & unit tests (Safetensors + Bubble Tea v2 Studio)
        working-directory: cli
        run: |
          go vet ./...
          go test -v ./...

      - name: Build native `ndiff` binary & verify Lip Gloss v2 + JSON parity
        shell: bash
        run: |
          mkdir -p bin
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          (cd cli && go build -trimpath -ldflags="-s -w" -o "../bin/ndiff${EXT}" ./cmd/ndiff)
          "./bin/ndiff${EXT}" --version
          "./bin/ndiff${EXT}" suites --json | python3 -m json.tool > /dev/null
          "./bin/ndiff${EXT}" --pretty --no-color status
          "./bin/ndiff${EXT}" --pretty --no-color suites
          "./bin/ndiff${EXT}" --pretty --no-color dag
