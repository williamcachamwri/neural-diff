name: Security, CVE Audit & Adversarial Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  security-gate:
    name: Secret Hygiene, Adversarial Deserialization & Supply-Chain CVEs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Provision Python 3.12 environment
        run: uv sync --locked --python 3.12

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Scan source tree for leaked credentials & tokens
        run: uv run python scripts/run_security_audit.py --secret-scan-only

      - name: Execute adversarial security test suite (pickle RCE, path traversal, symlink escape)
        run: uv run pytest -m security -v

      - name: Audit Python dependencies against PyPA Advisory DB
        run: uv run python -m pip_audit --skip-editable --desc

      - name: Audit npm dependencies against GitHub Advisory DB
        working-directory: frontend
        run: |
          npm ci
          npm audit
