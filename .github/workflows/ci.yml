name: NEURAL DIFF CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  backend-quality-and-tests:
    name: Python Lint, Typecheck, Unit, Property, Integration & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --locked --python 3.12

      - name: Ruff lint check
        run: uv run ruff check core adapters benchmarks api tests scripts

      - name: MyPy static type check
        run: uv run mypy core adapters benchmarks api

      - name: Unit, Property (Hypothesis), Integration, Regression & Security tests with coverage
        run: |
          uv run pytest --cov=core --cov=adapters --cov=benchmarks --cov=api --cov-report=term-missing --cov-fail-under=85 -v

      - name: Verify SHA-256 evidence manifest integrity
        run: uv run python scripts/verify_evidence.py

      - name: Python dependency vulnerability audit
        run: uv run python -m pip_audit --skip-editable --desc

  frontend-quality-and-e2e:
    name: Frontend TypeScript, Vitest, Build & Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv & Python backend for E2E
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Provision Python environment
        run: uv sync --locked --python 3.12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend dependency security audit
        working-directory: frontend
        run: npm audit

      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend component unit tests (Vitest)
        working-directory: frontend
        run: npm run test

      - name: Production Vite bundle build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Seed demo fixtures, launch live backend & preview servers, and run Playwright E2E
        run: |
          uv run python scripts/seed_demo_fixtures.py
          uv run uvicorn api.app:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          npm --prefix frontend run preview -- --host 127.0.0.1 --port 4173 > /tmp/frontend.log 2>&1 &
          FRONTEND_PID=$!
          trap "kill $BACKEND_PID $FRONTEND_PID 2>/dev/null || true" EXIT

          READY=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "=== Backend startup log ==="
            cat /tmp/backend.log || true
            echo "=== Frontend preview log ==="
            cat /tmp/frontend.log || true
            exit 1
          fi

          npm --prefix frontend run test:e2e
