name: Docs Link Check & Evidence Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-and-evidence-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-docs-and-manifest:
    name: SHA-256 Evidence Manifest & 5-Language Docs Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify SHA-256 & byte-size integrity of all evidence artifacts
        run: python3 scripts/verify_evidence.py

      - name: Verify local file & screenshot links across all 26 Markdown docs
        run: python3 scripts/verify_docs_links.py
