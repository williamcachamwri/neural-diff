name: Full-Stack Playwright E2E (Sharded Specs)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-playwright-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-studio:
    name: Build Production Vite 8 Studio Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22.x LTS
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies & build production bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload built studio dist
        uses: actions/upload-artifact@v7
        with:
          name: e2e-studio-dist
          path: frontend/dist
          retention-days: 3

  playwright-sharded:
    name: Chromium E2E (${{ matrix.suite_label }})
    needs: build-studio
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: "tests/e2e.spec.ts"
            suite_label: "Pairwise Studio & Security Gate"
          - spec: "tests/evolution.e2e.spec.ts"
            suite_label: "Neural Evolution DAG & Export"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Provision Python 3.12 backend environment
        run: uv sync --locked --python 3.12

      - name: Set up Node.js 22.x LTS
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright & frontend runtime
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Download built studio dist
        uses: actions/download-artifact@v8
        with:
          name: e2e-studio-dist
          path: frontend/dist

      - name: Seed Safetensors fixtures, boot FastAPI + Vite preview & run ${{ matrix.spec }}
        run: |
          uv run python scripts/seed_demo_fixtures.py
          uv run uvicorn api.app:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          npm --prefix frontend run preview -- --host 127.0.0.1 --port 4173 > /tmp/frontend.log 2>&1 &
          FRONTEND_PID=$!
          trap "kill $BACKEND_PID $FRONTEND_PID 2>/dev/null || true" EXIT

          READY=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/backend.log || true
            cat /tmp/frontend.log || true
            exit 1
          fi

          (cd frontend && npx playwright test ${{ matrix.spec }})

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ strategy.job-index }}
          path: |
            /tmp/backend.log
            /tmp/frontend.log
            frontend/test-results/
          retention-days: 7
